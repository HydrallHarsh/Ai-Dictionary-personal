name: Run Main Workflow

permissions:
  contents: read

concurrency:
  group: daily-ingestion-generation
  cancel-in-progress: false

on:
  workflow_dispatch:

  schedule:
    - cron: "35 4 * * *" # Works at 4:35 AM every day UTC

jobs:
  run-backend-main:
    if: ${{ github.event_name != 'schedule' || github.repository == 'recent-ai/Ai-Dictionary' }}
    runs-on: ubuntu-latest
    environment: Workflow

    timeout-minutes: 30

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python 3.12.5
        run: uv python install 3.12.5

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: uv sync --frozen

      - name: Run Backend Main Workflow
        env:
          PYTHONPATH: ${{ github.workspace }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend
          source .venv/bin/activate
          cd ..
          uv run --project backend python -m backend.services.ingestion.runner
    
  run-langgraph-bot:
    needs: run-backend-main
    runs-on: ubuntu-latest
    environment: Workflow

    timeout-minutes: 30

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python 3.12.5
        run: uv python install 3.12.5

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: uv sync --frozen

      - name: Install LangGraph Bot Dependencies
        working-directory: ./langgraph_bot
        run: uv sync --frozen

      - name: Run LangGraph Queue Worker
        # working-directory: ./langgraph_bot
        env:
          PYTHONPATH: ${{ github.workspace }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
          POLLINATIONS_SECRET_KEY: ${{secrets.POLLINATIONS_SECRET_KEY }}
        run: |
          cd langgraph_bot
          source .venv/bin/activate
          cd ..
          uv run --project langgraph_bot python -m langgraph_bot.main
